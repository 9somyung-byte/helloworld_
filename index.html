<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Studio - 시스템 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            /* 📸 보내주신 바다 사진을 배경으로 사용 */
            background-image: url('underwater-photo-pool_1219-17.avif');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 배경 어둡게 처리 (글씨 잘 보이게) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: white;
            font-size: 60px;
            margin-bottom: 50px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .menu-wrapper {
            display: flex;
            gap: 40px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 30px;
            width: 300px;
            text-decoration: none;
            color: #334155;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .menu-card:hover {
            transform: translateY(-15px);
            background: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .menu-card i {
            font-size: 80px;
            margin-bottom: 25px;
            color: #0ea5e9;
        }

        .menu-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .menu-card p {
            margin: 0;
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
        }

        /* 각각의 카드 포인트 컬러 */
        .aquarium-card i { color: #0284c7; }
        .tablet-card i { color: #f59e0b; }

        .footer {
            position: absolute;
            bottom: 30px;
            color: rgba(255,255,255,0.7);
            z-index: 10;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FISH STUDIO PORTAL</h1>
        
        <div class="menu-wrapper">
            <a href="aquarium.html" class="menu-card aquarium-card">
                <i class="fa-solid fa-water"></i>
                <h2>Aquarium View</h2>
                <p>대형 스크린 전시용 화면<br>물고기들이 헤엄치는 수조입니다.</p>
            </a>

            <a href="tablet.html" class="menu-card tablet-card">
                <i class="fa-solid fa-pen-to-square"></i>
                <h2>Drawing Tablet</h2>
                <p>아이패드/태블릿용 화면<br>물고기를 그려서 전송합니다.</p>
            </a>
        </div>
    </div>

    <div class="footer">
        © 2026 Fish Studio Management System
    </div>

</body>
</html>
