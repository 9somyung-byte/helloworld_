<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대형 애니메이션 아쿠아리움</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 📸 알려주신 오리지널 파일명을 그대로 완벽하게 매핑했습니다! */
            background-image: url('underwater-photo-pool_1219-17.avif'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ✨ 물속 햇살 일렁임 효과 */
        .light-rays {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.15) 100%);
            background-size: 200% 200%;
            pointer-events: none;
            animation: waveLight 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes waveLight {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🧼 보글보글 올라오는 거품 스타일 */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble linear infinite;
            z-index: 2;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-105vh) translateX(60px); opacity: 0; }
        }
        
        /* 🐟 물고기 레이아웃 */
        .fish-container {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .fish-img {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }

        /* 학번 이름 말풍선 네임택 */
        .fish-info {
            background: rgba(255, 255, 255, 0.9);
            color: #0284c7;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            border: 2px solid #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="light-rays"></div>
    <div id="aquarium"></div>

    <script src="aquarium.js"></script>
</body>
</html>
