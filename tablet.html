<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fish Studio - 나만의 물고기 그리기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #0ea5e9;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .main-container {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 95vw;
            max-height: 90vh;
        }

        /* 🎨 좌측: 캔버스 영역 */
        .canvas-section {
            position: relative;
        }

        #canvas {
            background: #ffffff;
            border-radius: 20px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            border: 2px solid #f1f5f9;
        }

        /* 🛠️ 우측: 컨트롤 영역 */
        .control-section {
            display: flex;
            flex-direction: column;
            width: 280px;
            justify-content: space-between;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-size: 32px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .header p {
            color: #64748b;
            margin: 0 0 20px 0;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-item {
            position: relative;
        }

        .input-item i {
            position: absolute;
            left: 12px;
            top: 13px;
            color: #94a3b8;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .tool-title {
            font-weight: bold;
            font-size: 14px;
            color: #475569;
            margin-bottom: 10px;
            display: block;
        }

        /* 색상 팔레트 그리드 */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .color-btn:hover { transform: translateY(-2px); }
        .color-btn.active { border-color: #334155; transform: scale(1.1); }

        /* 버튼 그룹 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button.action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-clear { background: #fee2e2; color: #ef4444; }
        .btn-clear:hover { background: #fecaca; }

        .btn-submit { background: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
        .btn-submit:hover { background: #0284c7; transform: translateY(-2px); }

        /* 펜 굵기 슬라이더 */
        .size-tool { margin-bottom: 20px; }
        #penSize { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="canvas-section">
            <canvas id="canvas" width="600" height="500"></canvas>
        </div>

        <div class="control-section">
            <div class="header">
                <h1>Fish Studio</h1>
                <p>당신의 물고기를 아쿠아리움에 보내세요!</p>
            </div>

            <div class="input-group">
                <div class="input-item">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="studentId" placeholder="학번 입력">
                </div>
                <div class="input-item">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="studentName" placeholder="이름 입력">
                </div>
            </div>

            <div class="color-section">
                <span class="tool-title"><i class="fa-solid fa-palette"></i> 색상 선택</span>
                <div class="color-grid">
                    <button class="color-btn active" style="background: #000000;" onclick="changeColor('#000000', this)"></button>
                    <button class="color-btn" style="background: #ef4444;" onclick="changeColor('#ef4444', this)"></button>
                    <button class="color-btn" style="background: #f97316;" onclick="changeColor('#f97316', this)"></button>
                    <button class="color-btn" style="background: #eab308;" onclick="changeColor('#eab308', this)"></button>
                    <button class="color-btn" style="background: #22c55e;" onclick="changeColor('#22c55e', this)"></button>
                    <button class="color-btn" style="background: #3b82f6;" onclick="changeColor('#3b82f6', this)"></button>
                    <button class="color-btn" style="background: #6366f1;" onclick="changeColor('#6366f1', this)"></button>
                    <button class="color-btn" style="background: #a855f7;" onclick="changeColor('#a855f7', this)"></button>
                </div>
            </div>

            <div class="size-tool">
                <span class="tool-title"><i class="fa-solid fa-pen-nib"></i> 펜 굵기</span>
                <input type="range" id="penSize" min="2" max="15" value="5" oninput="changeSize(this.value)">
            </div>

            <div class="button-group">
                <button class="action-btn btn-clear" onclick="clearCanvas()">
                    <i class="fa-solid fa-trash-can"></i> 전체 지우기
                </button>
                <button class="action-btn btn-submit" onclick="submitFish()">
                    <i class="fa-solid fa-paper-plane"></i> 아쿠아리움 전송
                </button>
            </div>
        </div>
    </div>

    <script src="tablet.js"></script>
</body>
</html>
